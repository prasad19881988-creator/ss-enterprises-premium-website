<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061733"><title>SS Enterprises | Employee Details</title>
<link rel="stylesheet" href="styles.css?v=20260826-final-v6">
<style>
body.qr-page{background:linear-gradient(145deg,#061733,#0d2c58);min-height:100vh;padding:20px;color:#10233f}.qr-shell{max-width:760px;margin:auto}.qr-profile{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.28)}.qr-head{background:linear-gradient(135deg,#061733,#123e78);color:#fff;padding:24px;display:flex;gap:18px;align-items:center}.qr-head img{width:78px;height:78px;object-fit:contain;border-radius:14px;background:#fff;padding:6px}.qr-head h1{margin:0;font:800 25px Manrope,Arial}.qr-head p{margin:5px 0 0;color:#cbd9eb}.qr-body{padding:24px}.qr-person{display:flex;gap:18px;align-items:center;margin-bottom:22px}.qr-person img{width:100px;height:100px;border-radius:18px;object-fit:cover;border:3px solid #d3aa42;background:#edf3f8}.qr-person h2{margin:0 0 5px;font:800 24px Manrope,Arial}.qr-badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eaf5df;color:#315c20;font-weight:800;font-size:11px}.qr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.qr-item{border:1px solid #dbe4ed;border-radius:14px;padding:13px;background:#f8fafc}.qr-item span{display:block;font-size:11px;color:#708097;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.qr-item b{display:block;margin-top:5px;font-size:15px;word-break:break-word}.qr-footer{padding:18px 24px;border-top:1px solid #e2e8ef;text-align:center;color:#68788d;font-size:12px}.qr-error{text-align:center;color:#fff;padding:50px 20px}.qr-loading{text-align:center;color:#fff;padding:50px 20px}@media(max-width:600px){body.qr-page{padding:10px}.qr-head{padding:18px}.qr-head img{width:62px;height:62px}.qr-body{padding:18px}.qr-grid{grid-template-columns:1fr}.qr-person{align-items:flex-start}.qr-person img{width:82px;height:82px}}
</style></head>
<body class="qr-page"><main class="qr-shell"><div id="state" class="qr-loading">Loading employee details…</div><article id="profile" class="qr-profile" hidden></article></main>
<script src="config.js?v=20260826-idcard"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n||0));
const cfg=window.SS_CONFIG||{};
const code=new URLSearchParams(location.search).get('employee');
async function run(){
 const state=document.getElementById('state'), profile=document.getElementById('profile');
 if(!code){state.className='qr-error';state.textContent='Employee ID is missing.';return}
 if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){state.className='qr-error';state.textContent='Company directory is not configured.';return}
 const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 const {data,error}=await sb.from('public_employee_directory').select('*').eq('employee_code',code).maybeSingle();
 if(error||!data){state.className='qr-error';state.textContent='Employee record not found.';return}
 state.hidden=true; profile.hidden=false;
 const logo=data.logo_url||'logo.png', photo=data.photo_url||'';
 profile.innerHTML=`<header class="qr-head"><img src="${esc(logo)}" onerror="this.src='logo.png'"><div><h1>${esc(data.company_name||'SS ENTERPRISES')}</h1><p>${esc(data.company_address||'')}</p><p>${esc(data.company_phone||'')} · ${esc(data.company_email||'')}</p></div></header><div class="qr-body"><div class="qr-person">${photo?`<img src="${esc(photo)}" alt="Employee photo">`:`<div class="qr-person-placeholder"></div>`}<div><h2>${esc(data.full_name)}</h2><span class="qr-badge">${esc(data.status||'active').toUpperCase()}</span><p>${esc(data.designation||'Staff')} · Employee ID: <b>${esc(data.employee_code)}</b></p></div></div><div class="qr-grid"><div class="qr-item"><span>Father Name</span><b>${esc(data.father_name||'—')}</b></div><div class="qr-item"><span>Department</span><b>${esc(data.department||'—')}</b></div><div class="qr-item"><span>Joining Date</span><b>${esc(data.joining_date||'—')}</b></div><div class="qr-item"><span>Location</span><b>${esc(data.location||'—')}</b></div><div class="qr-item"><span>Mobile</span><b>${esc(data.phone||'—')}</b></div><div class="qr-item"><span>Email</span><b>${esc(data.email||'—')}</b></div><div class="qr-item" style="grid-column:1/-1"><span>Address</span><b>${esc(data.address||'—')}</b></div></div></div><footer class="qr-footer">${esc(data.company_name||'SS ENTERPRISES')} · Employee profile opened from the SS Enterprises employee ID-card QR code.</footer>`;
}
run();
</script></body></html>
