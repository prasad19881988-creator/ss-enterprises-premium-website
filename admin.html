<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SS Enterprises | Admin Panel</title><link rel="stylesheet" href="styles.css?v=20260822-final"></head>
<body class="admin-body"><div class="admin-wrap">
<div class="admin-top"><a href="index.html">← Website</a><span>SS ENTERPRISES • ADMIN</span></div>
<section id="loginBox" class="admin-card"><h1>Admin Login</h1><p class="muted">Secure management of projects and team profiles.</p>
<input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password">
<button id="loginBtn" class="btn primary">Login</button><p id="loginMsg" class="msg"></p></section>
<section id="panel" hidden>
<div class="admin-head"><div><p class="eyebrow">CONTROL PANEL</p><h1>Manage Website</h1></div><button id="logout" class="btn ghost">Logout</button></div>
<div class="admin-card"><h2>Projects</h2><p class="muted">Add, edit or remove projects.</p><div id="projectForms"></div><button id="addProject" class="btn ghost">+ Add Project</button></div>
<div class="admin-card"><h2>Leadership & Our Team</h2><p class="muted">Experience is not used. Manage photo, name, designation, location, responsibilities and contact number.</p><div id="teamForms"></div></div>
<button id="saveAll" class="btn primary big">Save Changes</button><p id="saveMsg" class="msg"></p>
</section></div>
<script src="config.js?v=20260822-final"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const defaultData={projects:[{id:"abha",name:"ABHA Card Project",department:"Health / Digital Health Services",location:"Darbhanga",status:"active",description:"ABHA Card service work through the existing SS Enterprises digital service workflow.",date:"Active",link:"https://ss-enterprises-abha-app-2026.onrender.com/"},{id:"ayushman",name:"Ayushman Card KYC Project",department:"Ayushman Bharat",location:"Darbhanga",status:"upcoming",description:"Ayushman Card KYC related project. Details can be updated from the Admin Panel when confirmed.",date:"Upcoming",link:""}],team:[{id:"founder",role:"Founder",name:"Add Name",location:"Darbhanga, Bihar",responsibilities:"Overall vision, strategic decisions, business direction and major operations.",photo:"",contact:""},{id:"ceo",role:"CEO & Managing Director",name:"Add Name",location:"Darbhanga, Bihar",responsibilities:"Day-to-day operations, project and tender coordination, team management and organisational growth.",photo:"",contact:""},{id:"state-head",role:"State Head",name:"Add Name",location:"Bihar",responsibilities:"State-level project coordination, field operations and monitoring of district teams.",photo:"",contact:""},{id:"district-coordinator",role:"District Coordinator",name:"Add Name",location:"Darbhanga, Bihar",responsibilities:"District project implementation, field staff coordination and monitoring of assigned work.",photo:"",contact:""}]};
let data=JSON.parse(JSON.stringify(defaultData));
const configured=window.SS_CONFIG&&window.SS_CONFIG.SUPABASE_URL&&window.SS_CONFIG.SUPABASE_URL.startsWith("http")&&!window.SS_CONFIG.SUPABASE_URL.includes("PASTE_");
const sb=configured?supabase.createClient(window.SS_CONFIG.SUPABASE_URL,window.SS_CONFIG.SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function msg(el,text,ok=false){el.textContent=text;el.className="msg "+(ok?"ok":"")}
async function start(){if(!sb){$("loginMsg").textContent="Supabase configuration is required in config.js.";return}const {data:s}=await sb.auth.getSession();if(s.session)showPanel()}
$("loginBtn").onclick=async()=>{if(!sb)return msg($("loginMsg"),"Supabase is not configured.");const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)msg($("loginMsg"),error.message);else showPanel()};
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
async function showPanel(){$("loginBox").hidden=true;$("panel").hidden=false;const {data:r}=await sb.from("site_data").select("content").eq("id",1).maybeSingle();if(r?.content){const saved=r.content||{};const merge=(defaults,items)=>{const arr=Array.isArray(items)?items:[];return defaults.map(d=>{const f=arr.find(x=>x&&x.id===d.id);return f?{...d,...f}:{...d}}).concat(arr.filter(x=>x&&!defaults.some(d=>d.id===x.id)))};data={projects:merge(defaultData.projects,saved.projects),team:merge(defaultData.team,saved.team)}}renderProjects();renderTeam()}
function renderProjects(){$("projectForms").innerHTML=data.projects.map((p,i)=>`<div class="edit-row project-edit" data-i="${i}">
<input data-k="name" value="${esc(p.name)}" placeholder="Project Name"><input data-k="department" value="${esc(p.department)}" placeholder="Department / Client"><input data-k="location" value="${esc(p.location)}" placeholder="Location">
<select data-k="status"><option value="active" ${p.status==="active"?"selected":""}>active</option><option value="upcoming" ${p.status==="upcoming"?"selected":""}>upcoming</option><option value="completed" ${p.status==="completed"?"selected":""}>completed</option></select>
<input data-k="date" value="${esc(p.date)}" placeholder="Date / label"><input data-k="link" value="${esc(p.link)}" placeholder="Portal / Link"><textarea data-k="description" placeholder="Short description">${esc(p.description)}</textarea><button class="remove btn ghost">Remove</button></div>`).join("")}
function renderTeam(){$("teamForms").innerHTML=data.team.map((t,i)=>`<div class="edit-row team-edit" data-i="${i}"><h3>${esc(t.role)}</h3>
<input data-k="name" value="${esc(t.name)}" placeholder="Name"><input data-k="location" value="${esc(t.location)}" placeholder="State / District / Location">
<textarea data-k="responsibilities" placeholder="Responsibilities">${esc(t.responsibilities)}</textarea><input data-k="contact" value="${esc(t.contact)}" placeholder="Contact No.">
<input data-k="photo" value="${esc(t.photo)}" placeholder="Photo URL"><small>Experience field is intentionally removed.</small></div>`).join("")}
document.addEventListener("input",e=>{const row=e.target.closest(".edit-row");if(!row)return;const i=+row.dataset.i,k=e.target.dataset.k;if(k)data[row.classList.contains("team-edit")?"team":"projects"][i][k]=e.target.value});
document.addEventListener("change",e=>{const row=e.target.closest(".edit-row");if(!row)return;const i=+row.dataset.i,k=e.target.dataset.k;if(k){const arr=row.classList.contains("team-edit")?data.team:data.projects;arr[i][k]=e.target.value}});
document.addEventListener("click",e=>{if(e.target.classList.contains("remove")){const i=+e.target.closest(".project-edit").dataset.i;data.projects.splice(i,1);renderProjects()}});
$("addProject").onclick=()=>{data.projects.push({id:"p-"+Date.now(),name:"New Project",department:"Department / Client",location:"Location",status:"upcoming",description:"Add genuine project details.",date:"Coming Soon",link:""});renderProjects()};
$("saveAll").onclick=async()=>{if(!sb)return msg($("saveMsg"),"Supabase is not configured.");const {error}=await sb.from("site_data").upsert({id:1,content:data,updated_at:new Date().toISOString()});msg($("saveMsg"),error?"Save failed: "+error.message:"Changes saved successfully.",!error)};
start();
</script></body></html>
